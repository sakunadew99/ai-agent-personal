# Shared ruff config for backend/ and mcp-service/.
# Start conservative (real errors only); tighten rule by rule in later phases.
target-version = "py312"
line-length = 120
extend-exclude = ["**/.venv", "**/node_modules", "apps", ".gradle-cache"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]   # existing code uses compact one-line statements

[lint.per-file-ignores]
"**/alembic/versions/*.py" = ["F401"]
