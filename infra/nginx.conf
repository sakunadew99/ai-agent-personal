# Example production edge. Terminate TLS here and proxy to the app containers.
# Replace server_name and certificate paths before use.

server {
    listen 443 ssl;
    server_name sakuna.example.com;

    ssl_certificate     /etc/letsencrypt/live/sakuna.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakuna.example.com/privkey.pem;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://mcp:8100;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
