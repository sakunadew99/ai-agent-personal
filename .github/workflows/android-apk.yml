name: Android APK

# Free fallback for when the EAS Build quota is used up (guide section 7.2).
# Run it manually: Actions -> Android APK -> Run workflow.
#
# Signing: an update installs over the old app ONLY if signed with the same key. Add these secrets
# once and keep a backup of the keystore outside the repo:
#   ANDROID_KEYSTORE_BASE64   base64 of your .keystore/.jks file
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key (fine for a first test only).

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "EXPO_PUBLIC_API_URL baked into the APK (must be HTTPS for release)"
        required: true
        default: "https://sakuna.example.com"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    environment: RENDER_SERVICE_TOKEN   # the signing-key secrets live in this environment
    defaults: { run: { working-directory: apps/mobile } }
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Android SDK packages (the runner image already has the SDK and sdkmanager)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.0.12077973" "platform-tools" > /dev/null
          "$SDKM" --list_installed | grep -E "platforms;android-37|build-tools;37|ndk;27"
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install
      - name: Use the permanent release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::warning::No keystore secrets; APK uses a throwaway debug key"; exit 0; fi
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          # Start with a newline: the generated gradle.properties may not end with one.
          echo >> android/gradle.properties
          cat >> android/gradle.properties <<EOF
          SAKUNA_STORE_FILE=release.keystore
          SAKUNA_STORE_PASSWORD=$KS_PASS
          SAKUNA_KEY_ALIAS=$KEY_ALIAS
          SAKUNA_KEY_PASSWORD=$KEY_PASS
          EOF
          # Point the generated release build at the permanent key instead of the debug key.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()
          release_cfg = """
                  release {
                      storeFile file(SAKUNA_STORE_FILE)
                      storePassword SAKUNA_STORE_PASSWORD
                      keyAlias SAKUNA_KEY_ALIAS
                      keyPassword SAKUNA_KEY_PASSWORD
                  }"""
          s = s.replace("signingConfigs {", "signingConfigs {" + release_cfg, 1)
          s = re.sub(r"(release\s*\{[^{}]*?)signingConfig signingConfigs\.debug", r"\1signingConfig signingConfigs.release", s, count=1, flags=re.S)
          p.write_text(s)
          PY
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: |
          # React Native release builds need more heap than Gradle's default on the 7 GB runners.
          echo >> gradle.properties   # the file may not end with a newline
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the real error publicly (annotations + job summary) instead of only "exit code 1".
            {
              echo "### Gradle failed (exit $code)"
              echo '```'
              awk '/What went wrong/{p=1} p&&/^\* Try:/{exit} p' gradle.log | head -60
              grep -E "error:|FAILED|Could not|Exception" gradle.log | grep -v "^\s*at " | head -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            awk '/What went wrong/{p=1} p&&/^\* Try:/{exit} p' gradle.log | head -25 | tr '\n' ' ' | sed 's/^/::error title=Gradle::/' ; echo
            grep -E "error:|FAILED" gradle.log | head -8 | while read -r line; do echo "::error title=Gradle detail::${line:0:900}"; done
          fi
          exit "$code"
      - uses: actions/upload-artifact@v7
        with:
          name: sakuna-${{ github.sha }}.apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
