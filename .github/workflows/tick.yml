name: Worker tick

# Free hosts cannot keep a background worker running, so this schedule runs one round of the
# reminder/check-in worker on the Render API every 10 minutes (GitHub may delay runs a few minutes).
# It also keeps the free Render service awake.
#
# Setup (GitHub > Settings > Environments > "RENDER_SERVICE_TOKEN"):
#   variable API_BASE_URL  = https://<your-service>.onrender.com
#   secret   SERVICE_TOKEN = the SERVICE_TOKEN value configured on Render
# The environment must have no required reviewers, or every tick would wait for approval.
# GitHub pauses scheduled workflows after 60 days without repository activity; re-enable it in Actions.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    environment: RENDER_SERVICE_TOKEN   # holds API_BASE_URL (variable) and SERVICE_TOKEN (secret)
    timeout-minutes: 5
    steps:
      - name: Run one worker round
        env:
          API: ${{ vars.API_BASE_URL }}
          TOKEN: ${{ secrets.SERVICE_TOKEN }}
        run: |
          if [ -z "$API" ] || [ -z "$TOKEN" ]; then
            echo "::warning::API_BASE_URL or SERVICE_TOKEN is not set in the RENDER_SERVICE_TOKEN environment; skipping."
            exit 0
          fi
          # The first request may wake a sleeping free instance (can take ~60 s).
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 -X POST \
            -H "X-Service-Token: $TOKEN" "$API/api/v1/internal/tick"
