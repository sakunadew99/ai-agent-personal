<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Skin & glow check</title>
<style>
:root{--bg:#070b09;--card:#0f1613;--line:#1d2a24;--text:#eef6f1;--muted:#8a9b92;--green:#3ee08f;--amber:#f5b65b;--red:#ff7a8a;--pink:#ff9ecf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 2px}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:14px;padding:12px 14px;font-weight:800;font-size:15px;background:var(--line);color:var(--text)}
.go{background:var(--pink);color:#2a0618}.save{background:var(--green);color:#04170d}
.stage{position:relative;margin-top:10px;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:3/4}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}
.oval{position:absolute;left:18%;right:18%;top:12%;bottom:16%;border:3px dashed #ffffff88;border-radius:50%;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}#score{font-size:64px;font-weight:900;text-align:center;line-height:1;margin-top:10px}
</style></head><body>
<h1>✨ Skin & glow check</h1><div class="muted">Face a window in daylight, no flash, no make-up. Fit your face in the oval. The photo never leaves this screen; only the numbers are saved.</div>
<div class="stage"><video id="v" playsinline muted></video><canvas id="c" style="display:none"></canvas><div class="oval" id="oval"></div></div>
<div class="row" style="margin-top:10px"><button id="cam" class="go" style="flex:1">📷 Open camera</button><button id="scan" style="flex:1" disabled>✨ Scan now</button></div>
<div id="out" style="display:none">
  <div id="score">—</div><div class="muted" style="text-align:center">glow score</div>
  <div class="grid">
    <div class="stat"><b id="bright">—</b><span class="muted">brightness</span></div><div class="stat"><b id="red">—</b><span class="muted">redness</span></div>
    <div class="stat"><b id="even">—</b><span class="muted">evenness</span></div><div class="stat"><b id="shine">—</b><span class="muted">shine</span></div>
    <div class="stat"><b id="spots">—</b><span class="muted">spots</span></div><div class="stat"><b id="light">—</b><span class="muted">lighting</span></div>
  </div>
  <div id="lnote" class="muted" style="margin-top:8px;color:var(--amber)"></div>
  <div class="row" style="margin-top:10px"><button id="again" style="flex:1">↻ Scan again</button><button id="save" class="save" style="flex:1">✓ Save numbers</button></div>
</div>
<div id="err" class="muted" style="color:var(--amber);margin-top:8px"></div>
<script type="module">
const $=id=>document.getElementById(id);let fl,video=$("v"),cv=$("c"),g=cv.getContext("2d",{willReadFrequently:true}),result=null;
function post(d){const s=JSON.stringify(d);if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(s);else if(window.parent!==window)window.parent.postMessage(s,"*");}
function lab(r,gg,b){const f=c=>{c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)};const R=f(r),G=f(gg),B=f(b);
  let x=(R*0.4124+G*0.3576+B*0.1805)/0.95047,y=R*0.2126+G*0.7152+B*0.0722,z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const h=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;x=h(x);y=h(y);z=h(z);return[116*y-16,500*(x-y),200*(y-z)];}
// face mesh points: forehead, left cheek, right cheek, nose tip, chin
const REG={forehead:151,left_cheek:50,right_cheek:280,nose:4,chin:200};
function patch(px,py,rad){const x0=Math.max(0,Math.round(px-rad)),y0=Math.max(0,Math.round(py-rad)),w=Math.min(cv.width-x0,Math.round(rad*2)),h=Math.min(cv.height-y0,Math.round(rad*2));
  const d=g.getImageData(x0,y0,w,h).data,L=[],A=[],S=[];for(let i=0;i<d.length;i+=16){const[l,a,bb]=lab(d[i],d[i+1],d[i+2]);L.push(l);A.push(a);S.push(Math.hypot(a,bb));}return{L,A,S};}
const mean=v=>v.reduce((a,b)=>a+b,0)/v.length,sd=v=>{const m=mean(v);return Math.sqrt(mean(v.map(x=>(x-m)**2)))};
async function openCam(){$("err").textContent="Loading the face model…";
  try{if(!fl){const v=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
      const files=await v.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      fl=await v.FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},runningMode:"IMAGE",numFaces:1});}
    video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:960}},audio:false});await video.play();
    $("err").textContent="";$("scan").disabled=false;$("cam").disabled=true;}
  catch(e){$("err").textContent="Camera or model not available: "+e.message+". Allow the camera for Sakuna and check your internet.";}}
function scan(){cv.width=video.videoWidth;cv.height=video.videoHeight;g.drawImage(video,0,0);const r=fl.detect(cv);const p=r.faceLandmarks&&r.faceLandmarks[0];
  if(!p){$("err").textContent="No face found. Move closer, face the light, and try again.";return;}$("err").textContent="";
  const fw=Math.abs(p[234].x-p[454].x)*cv.width,rad=Math.max(6,fw*0.07),regions={},allL=[],allA=[];let shineN=0,shineT=0,spotN=0,spotT=0;
  for(const[k,i]of Object.entries(REG)){const q=patch(p[i].x*cv.width,p[i].y*cv.height,k==="nose"?rad*0.7:rad);const mL=mean(q.L),mA=mean(q.A),sL=sd(q.L);
    regions[k]={L:+mL.toFixed(1),a:+mA.toFixed(1)};allL.push(...q.L);allA.push(...q.A);
    if(k==="forehead"||k==="nose"){shineT+=q.L.length;q.L.forEach((l,j)=>{if(l>mL+1.6*sL&&q.S[j]<14)shineN++;});}
    if(k!=="nose"){spotT+=q.L.length;q.L.forEach((l,j)=>{if(q.A[j]>mA+9||l<mL-14)spotN++;});}}
  const brightness=mean(allL),redness=mean(allA),cheekDiff=Math.abs(regions.left_cheek.L-regions.right_cheek.L);
  const evenness=Math.max(0,Math.min(100,100-sd(allL)*3.2)),shine=shineN/shineT*100,spot=spotN/spotT*1000;
  const lightingOk=brightness>35&&brightness<88&&cheekDiff<12;
  let score=40+evenness*0.35-Math.max(0,redness-10)*1.6-Math.max(0,spot-10)*0.35+(shine>=1&&shine<=8?8:shine>15?-6:2)+Math.min(10,Math.max(0,(brightness-45)*0.3));
  score=Math.round(Math.max(0,Math.min(100,score)));
  result={kind:"skin",score,brightness:+brightness.toFixed(1),redness:+redness.toFixed(1),evenness:Math.round(evenness),shine_pct:+shine.toFixed(1),spot_density:Math.round(spot),
    lighting_ok:lightingOk,lighting_note:lightingOk?"":(brightness<=35?"Too dark: face a window":brightness>=88?"Too bright: avoid direct sun or flash":"One side of your face is brighter: face the light straight on"),regions};
  $("out").style.display="";$("score").textContent=score;$("score").style.color=score>=70?"var(--green)":score>=50?"var(--amber)":"var(--red)";
  $("bright").textContent=Math.round(brightness);$("red").textContent=redness.toFixed(1);$("even").textContent=Math.round(evenness)+"%";$("shine").textContent=shine.toFixed(1)+"%";
  $("spots").textContent=Math.round(spot);$("light").textContent=lightingOk?"good":"check";$("lnote").textContent=result.lighting_note;}
$("cam").onclick=openCam;$("scan").onclick=scan;$("again").onclick=scan;
$("save").onclick=()=>{if(!result)return;post(result);if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());$("save").disabled=true;$("save").textContent="Saved ✓";};
</script></body></html>
